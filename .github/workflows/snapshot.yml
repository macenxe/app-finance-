name: Snapshot après changement de produits

# Se déclenche quand la définition des produits/sous-jacents change (plus de tâche toutes les
# 30 min : les cours en direct viennent du Worker), et chaque semaine pour rafraîchir le repli
# statique des graphiques (front/data/history/eq/, utilisé si le Worker est injoignable côté
# client, ex. pare-feu d'entreprise bloquant *.workers.dev).
on:
  push:
    branches: [main]
    paths:
      - 'back/src/produits.ts'
      - 'back/src/indices.ts'
      - 'back/src/snapshot.ts'
  schedule:
    - cron: '17 5 * * 1'            # lundi 05:17 UTC
  workflow_dispatch:               # bouton de déclenchement manuel

permissions:
  contents: write
  actions: write                 # pour déclencher le déploiement Pages après commit du snapshot

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Installer les dépendances
        working-directory: back
        run: npm ci

      - name: Générer le snapshot
        working-directory: back
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run snapshot

      - name: Générer le repli statique des graphiques
        working-directory: back
        run: npm run history

      # Notes Morningstar, société de gestion et performances calendaires des UC. Non bloquant :
      # l'endpoint quoteSummary de Yahoo exige un cookie + crumb et peut refuser ponctuellement —
      # le fichier précédent reste alors en place, la liste des fonds s'affiche sans les notes.
      - name: Générer les fiches signalétiques des fonds
        working-directory: back
        continue-on-error: true
        run: npm run fonds

      # Historique complet (VL, depuis l'inception) des UC via FT Markets. Non bloquant : mêmes
      # raisons que ci-dessus (source tierce), les fichiers précédents restent en place si KO.
      - name: Générer l'historique des UC
        working-directory: back
        continue-on-error: true
        run: npm run uc

      - name: Publier si le snapshot a changé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add front/data/snapshot.json front/data/history/eq/ front/data/fonds-meta.json front/data/history/uc/
          if git diff --staged --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "chore: snapshot après mise à jour des produits"
            git pull --rebase --autostash origin main
            git push
            # Le commit ci-dessus (GITHUB_TOKEN) ne déclenche pas deploy.yml : on l'appelle explicitement.
            gh workflow run "Deploy to GitHub Pages" --ref main
          fi
