name: Fond d'actualités (Google News via Actions)

# Google News bloque les IP Cloudflare Workers (503) mais répond à GitHub Actions :
# ce cron génère front/data/news-fond.json (canaux globales/produits/eco/fiscal/uc),
# que le Worker fusionne avec ses flux directs (ABC, BFM, BCE, Sénat). Cf. D30.
on:
  schedule:
    - cron: '7 5-20 * * *'         # toutes les heures, 05:07-20:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write                 # pour déclencher le déploiement Pages après commit

concurrency:
  group: news-fond
  cancel-in-progress: false

jobs:
  fond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Installer les dépendances
        working-directory: back
        run: npm ci

      - name: Générer le fond d'actualités
        working-directory: back
        run: npm run newsfond

      - name: Committer si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add front/data/news-fond.json
          if git diff --cached --quiet; then
            echo "Fond inchangé, rien à committer."
          else
            git commit -m "Fond d'actualités $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
